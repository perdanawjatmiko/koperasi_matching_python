[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "koperasi-match"
version = "0.1.0"
description = "CLI untuk mencocokkan alamat wilayah dengan referensi data koperasi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "pydantic>=2.8",
  "rapidfuzz>=3.9",
  "rich>=13.8",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
koperasi-match = "koperasi_match.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/koperasi_match"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
